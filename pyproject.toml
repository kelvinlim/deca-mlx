[project]
name = "deca-mlx"
version = "0.2.0"
description = "DECA inference on Apple MLX and PyTorch (ROCm / CUDA / CPU)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pillow",
  "opencv-python-headless",
  "scipy",
  "scikit-image",
  "safetensors",
]

[project.optional-dependencies]
apple = ["mlx"]
convert = ["torch"]
torch = ["torch"]
dev = ["pytest"]

[project.scripts]
deca-mlx = "deca_mlx.demo:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["deca_mlx*"]
